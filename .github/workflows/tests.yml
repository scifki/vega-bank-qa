name: автотесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Прогнать тесты
        run: behave -f json -o reports/behave.json features

      - name: Собрать HTML-отчёт
        if: always()
        run: python make_html_report.py reports/behave.json reports/behave-report.html

      - name: Проверить обращение к БД
        run: python db_check.py

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-report
          path: reports/behave-report.html
